<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- 标题：文章页用文章标题，首页用站点标题 -->
  <title>人工智能_前沿科技_新时代科学技术网</title>

  <!-- 描述：文章页用文章描述，首页用站点描述 -->
  <meta name="description" content="新时代科学技术网{{ page.description | default: site.description }}">

  <!-- 关键词：文章页用文章关键词，首页用站点关键词 -->
  <meta name="keywords" content="{{ page.keywords | default: site.keywords }}">

  <!-- 作者与版权 -->
  <meta name="author" content="{{ site.title }}">

  <!-- 百度站长验证 -->
  {% if site.baidu_verify %}
  <meta name="baidu-site-verification" content="{{ site.baidu_verify }}">
  {% endif %}

  <!-- 移动端适配 -->
  <meta name="applicable-device" content="pc,mobile">
  <meta name="MobileOptimized" content="width">
  <meta name="HandheldFriendly" content="true">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- 顶部 Logo -->
  <div class="az_header">
    <div class="az_header_box">
      <div class="logo">
        <a href="{{ '/' | relative_url }}" title="{{ site.title }}"></a>
      </div>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="daohang">
    <div class="daohang_box">
    <a href="{{ '/' | relative_url }}" title="首页">首页</a>
    <a href="{{ '/ai' | relative_url }}" title="人工智能">人工智能</a>
    <a href="{{ '/frontier' | relative_url }}" title="前沿科技">前沿科技</a>
    <a href="{{ '/about' | relative_url }}" title="关于我们">关于我们</a>
    </div>
  </div>

  <!-- 页面主体内容，由各页面自己填充 -->
  <div class="main">
    {{ content }}
  </div>

  <!-- 页脚 -->
  <div class="footer">
    <p>Copyright © {{ site.time | date: "%Y" }} <a href="{{ '/' | relative_url }}">{{ site.title }}</a> 版权所有</p>
  </div>

</body>
</html>
