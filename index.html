---
layout: default
title: 科学技术文章网
---

<div class="sidebar">
  当前位置：<a href="{{ '/' | relative_url }}">首页</a>
</div>

<div class="main-left">
  <div class="az_list">
    <div class="az_list_t"><span><em></em>最新文章</span></div>
    <ul>
      {% for post in site.posts %}
      <li>
        <a href="{{ post.url | relative_url }}" title="{{ post.title }}">
          <h2>{{ post.title }}</h2>
          <span>{{ post.date | date: "%Y-%m-%d" }}</span>
          <p>{{ post.excerpt | strip_html | truncate: 100 }}</p>
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>
