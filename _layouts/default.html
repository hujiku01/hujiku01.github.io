<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- 顶部 Logo -->
  <div class="az_header">
    <div class="az_header_box">
      <div class="logo">
        <a href="{{ '/' | relative_url }}" title="{{ site.title }}"></a>
      </div>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="daohang">
    <div class="daohang_box">
    <a href="{{ '/' | relative_url }}" title="首页">首页</a>
    <a href="{{ '/ai' | relative_url }}" title="人工智能">人工智能</a>
    <a href="{{ '/frontier' | relative_url }}" title="前沿科技">前沿科技</a>
    <a href="{{ '/about' | relative_url }}" title="关于我们">关于我们</a>
    </div>
  </div>

  <!-- 页面主体内容，由各页面自己填充 -->
  <div class="main">
    {{ content }}
  </div>

  <!-- 页脚 -->
  <div class="footer">
    <p>Copyright © {{ site.time | date: "%Y" }} <a href="{{ '/' | relative_url }}">{{ site.title }}</a> 版权所有</p>
  </div>

</body>
</html>
